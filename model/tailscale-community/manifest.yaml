manifestVersion: 1
name: "@bixu/tailscale-community"
version: "2026.10.13.1"
description: "Community add-ons for @swamp/tailscale, gathered from other swamp extensions with their prior art recorded. Adds read-only ACL drift detection and GitOps change proposals to @swamp/tailscale/policy-file."
repository: https://github.com/bixu/swamp-extensions
paths:
  base: manifest
models:
  - policy_drift.ts
  - policy_propose.ts
additionalFiles:
  - hujson.ts
  - README.md
  - LICENSE.txt
  - prior-art.yaml
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - tailscale
  - acl
  - gitops
  - drift
  - community
dependencies:
  - "@swamp/tailscale"
