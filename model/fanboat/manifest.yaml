manifestVersion: 1
name: "@bixu/fanboat"
version: "2026.09.23.1"
description: "Map any swamp repo — workflows, models, vaults, types, extension modules and packages — as one graph, rendered as an interactive D3 page"
repository: https://github.com/bixu/swamp-extensions
paths:
  base: manifest
models:
  - fanboat.ts
additionalFiles:
  - fanboat_scan.ts
  - fanboat.html.txt
  - README.md
  - LICENSE.txt
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - visualization
  - architecture
  - d3
  - typescript
  - documentation
