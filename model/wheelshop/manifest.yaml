manifestVersion: 1
name: "@bixu/wheelshop"
version: "2026.10.13.3"
description: "Trust-gate auditor for npm/jsr packages used inside swamp extension models, plus survey, smoosh and prior-art attribution for building extensions from parts of community swamp extensions"
repository: https://github.com/bixu/swamp-extensions
paths:
  base: manifest
models:
  - wheelshop.ts
skills:
  - swamp-wheelshop
additionalFiles:
  - wheelshop_helpers.ts
  - wheelshop_smoosh.ts
  - wheelshop_survey.ts
  - README.md
  - LICENSE.txt
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - npm
  - jsr
  - dependencies
  - supply-chain
  - typescript
  - guardrail
  - attribution
